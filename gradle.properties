org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# The published coordinates (RELEASING.md). VERSION_NAME moves with SDK_VERSION in
# sdk-android/src/main/kotlin/com/funnelbase/sdk/Wire.kt, which is what goes on the wire; the
# release workflow refuses a tag that disagrees with either.
GROUP=com.funnel-base
VERSION_NAME=0.4.0

# What every published POM carries. Each module's own gradle.properties adds its artifact id,
# name and description.
POM_URL=https://github.com/Funnelbase/funnelbase-android
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/Funnelbase/funnelbase-android
POM_SCM_CONNECTION=scm:git:https://github.com/Funnelbase/funnelbase-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/Funnelbase/funnelbase-android.git
POM_DEVELOPER_ID=funnelbase
POM_DEVELOPER_NAME=Funnelbase
POM_DEVELOPER_URL=https://funnel-base.com
